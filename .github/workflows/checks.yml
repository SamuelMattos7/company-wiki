name: Wiki checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests
      - run: python scripts/lint_markers.py
      - run: python scripts/demo.py
      - run: python scripts/demo.py --profile water-utilities
